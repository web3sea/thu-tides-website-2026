<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 280 600 280" width="600" height="280">
  <defs>
    <!-- Sand wave gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A08B6A"/>
      <stop offset="100%" style="stop-color:#C2A882"/>
    </linearGradient>

    <!-- Foam highlight - sand light -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4C4A8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#D4C4A8;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Wave forms - sand colored, flowing curves -->
  <g>
    <!-- Deep background wave -->
    <path d="M 100 520
             Q 220 440, 350 480
             T 590 450
             T 700 490
             L 700 560
             L 100 560 Z"
          fill="#A08B6A" opacity="0.25"/>

    <!-- Mid wave 1 -->
    <path d="M 100 540
             C 190 480, 270 510, 370 490
             S 490 440, 570 470
             S 650 510, 700 460
             L 700 560
             L 100 560 Z"
          fill="url(#waveGrad)" opacity="0.3"/>

    <!-- Mid wave 2 -->
    <path d="M 100 555
             C 210 520, 300 550, 410 530
             S 540 500, 620 520
             S 670 545, 700 525
             L 700 560
             L 100 560 Z"
          fill="#C2A882" opacity="0.25"/>

    <!-- Front wave -->
    <path d="M 100 560
             C 170 545, 250 555, 350 548
             S 470 538, 550 548
             S 650 558, 700 550
             L 700 560
             L 100 560 Z"
          fill="#D4C4A8" opacity="0.2"/>

    <!-- Foam line - thin accent -->
    <path d="M 100 540
             C 190 480, 270 510, 370 490
             S 490 440, 570 470
             S 650 510, 700 460"
          fill="none" stroke="url(#foamGrad)" stroke-width="1.2" opacity="0.6"/>

    <!-- Second foam accent -->
    <path d="M 100 555
             C 210 520, 300 550, 410 530
             S 540 500, 620 520
             S 670 545, 700 525"
          fill="none" stroke="#D4C4A8" stroke-width="0.7" opacity="0.3"/>
  </g>

  <!-- THU TIDES text - sand colored -->
  <!-- Top line: THU -->
  <text x="400" y="380"
        text-anchor="middle"
        font-family="'Didot', 'Playfair Display', 'Bodoni Moda', 'Georgia', serif"
        font-size="88"
        font-weight="400"
        letter-spacing="22"
        fill="#C2A882"
        opacity="0.95">THU</text>

  <!-- Bottom line: TIDES -->
  <text x="400" y="460"
        text-anchor="middle"
        font-family="'Didot', 'Playfair Display', 'Bodoni Moda', 'Georgia', serif"
        font-size="88"
        font-weight="400"
        letter-spacing="22"
        fill="#C2A882"
        opacity="0.95">TIDES</text>

  <!-- Thin horizontal accent line between words -->
  <line x1="280" y1="392" x2="520" y2="392" stroke="#D4C4A8" stroke-width="0.8" opacity="0.35"/>

</svg>
